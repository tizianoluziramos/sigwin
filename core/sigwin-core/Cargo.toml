[package]
name = "sigwin-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# cdylib -> sigwin_core.dll for the C# app to P/Invoke (used from Phase 2).
# rlib   -> so the in-repo `harness` binary can call the core as a normal crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
# presage is not published on crates.io — pin it (and its sqlite store, from the
# same repo) to a specific commit for reproducible builds.
presage = { git = "https://github.com/whisperfish/presage", rev = "63482efd0cbdc0780baf0650517c7d55f1cac05d" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "63482efd0cbdc0780baf0650517c7d55f1cac05d" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
base64 = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# sqlcipher (bundled via presage-store-sqlite) needs OpenSSL to link libcrypto.
# We provide it as a system dependency via vcpkg (dynamic link), located through
# the OPENSSL_DIR environment variable — see docs/setup.md. No extra crate is
# needed here; libsqlite3-sys picks OpenSSL up from OPENSSL_DIR.

[build-dependencies]
csbindgen = "1.9"
